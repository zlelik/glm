# Development profile (activated by 'mvn spring-boot:run -Pdev', which sets spring-boot.run.profiles=dev).
# Inherits the in-memory H2 database and demo-data seeding from the base config; adds verbose diagnostics.
# (logback-spring.xml additionally raises info.gamed.glm to DEBUG under this same 'dev' profile.)

# Echo the generated SQL to the console - handy in dev, too noisy for production.
spring.jpa.show-sql=true
