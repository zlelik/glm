# The app runs behind an HTTPS-terminating edge (Cloudflare in front, and Tomcat's own TLS connector).
# FRAMEWORK registers Spring's ForwardedHeaderFilter so the app honours X-Forwarded-* headers and builds
# correct https:// URLs, secure cookies and redirects. FRAMEWORK works on an external Tomcat (unlike
# NATIVE, which only applies to the embedded server).
server.forward-headers-strategy=FRAMEWORK

#debug=true
#trace=true


# Schema management strategy (Hibernate hbm2ddl):
#   update      - additive, data-preserving. On startup Hibernate compares the entities to the existing
#                 schema and: creates tables/columns that are missing, leaves existing tables and DATA
#                 untouched. It does NOT drop removed columns/tables, does NOT rename, and generally does
#                 NOT alter existing columns (e.g. widening a column length or changing a type is usually
#                 not applied). It also cannot migrate/backfill data. Fine for early-stage development;
#                 for anything beyond that use validate + a migration tool (Flyway/Liquibase).
#   create      - DROPS and recreates the whole schema on every startup -> ALL DATA LOST each boot. Don't use.
#   create-drop - same as create, and also drops the schema on shutdown. Only for throwaway tests.
#   validate    - makes no changes; only verifies the entities match the existing schema (use with Flyway).
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=create

# No datasource is configured here, so Spring Boot starts an in-memory H2 database by default (used for
# local dev, the 'dev' profile and tests). Production uses MySQL via the 'prod' profile - the externalized
# connection settings live in application-prod.properties.

# Connection pool (HikariCP). Applies to whatever database is configured above - it pools the JDBC
# connections regardless of vendor (H2 now, MySQL later), so this value carries over unchanged when you
# switch. Keep gml.game_processor_threads <= this value, since each concurrently processed game chunk
# holds one connection.
spring.datasource.hikari.maximum-pool-size=100
# SQL logging is enabled only in the 'dev' profile (see application-dev.properties); off by default/prod.


#these 2 lines below automatically convert camelCase to snake_case (filedName in java will be converted to field_name in database)
#It was decided to add @Column annotation only if there is a need to change default length(255) or other default params (nullable, unique etc.).
#For most of the cases the default approach with params below should work.

#This configuration is more precise and also works fine and converts userName in Java to user_name in DB
#The are default Spring values as described here: https://docs.spring.io/spring-boot/how-to/data-access.html
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.hibernate.SpringImplicitNamingStrategy

#logging.level.org.springframework.data.rest=TRACE
#logging.level.org.springframework.data.repository=TRACE


spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#switch it to true if @Version field will be added in future. 
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true


#logging.level.org.hibernate.jdbc.BatchingBatch=DEBUG
#logging.level.org.hibernate.engine.jdbc.batch.internal.BatchingBatch=DEBUG
#logging.level.org.hibernate.engine.jdbc.batch.internal.AbstractBatchImpl=DEBUG


#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE
#logging.level.org.hibernate.engine.jdbc.batch.internal=DEBUG
#logging.level.org.hibernate.event.internal.AbstractFlushingEventListener=DEBUG


# Custom GLM properties (bound to the GameProperties @ConfigurationProperties class).
# Kebab-case is Spring Boot's recommended key format; relaxed binding maps it to the camelCase fields.
gml.delete-cells-batch-size=1000
# Auto-finish a game after this many unchanged iterations (more live cells wins). 0/-1 disables it.
gml.max-stale-iterations=10
# Cap on the "accumulated cell" credits a player can bank (each iteration grants +1; placing a cell/object
# spends 1 per cell). Should exceed the biggest known object (88 cells). 0/-1 = unbounded.
gml.max-accumulated-cells=100
# Max number of games processed concurrently (one game per worker task). A value > 0 is used as-is;
# 0, negative, or absent => auto = (logical CPU count * 2). Keep this <= spring.datasource.hikari.maximum-pool-size,
# because each running task holds one DB connection (exceeding it only makes processing slower, never crashes).
gml.game-processor-threads=50
