# Production profile (activate with SPRING_PROFILES_ACTIVE=prod, e.g. in docker-compose.yml).
# Uses an externalized MySQL database instead of H2, keeps logs quiet, and does NOT seed demo data
# (DatabaseLoader is @Profile("!prod")).

# MySQL connection, supplied via environment variables so no credentials live in the repo. The driver is
# auto-detected from the JDBC URL (the MySQL connector is on the classpath).
#
# IMPORTANT for insert performance: put rewriteBatchedStatements=true in the JDBC URL (GLM_DB_URL), e.g.
#   jdbc:mysql://host:3306/glm?rewriteBatchedStatements=true
# Without this flag MySQL's Connector/J executes a JDBC batch as N individual INSERTs (one round-trip each),
# so hibernate.jdbc.batch_size has almost no effect. With it, the driver rewrites each batch into a single
# multi-row "INSERT ... VALUES (?),(?),..." statement. The per-tick cell inserts (SingleGameProcessor) are
# the hot path this speeds up. (H2 in dev batches without any such flag; this is a MySQL-only requirement.)
# Cell's AUTO->CELL_SEQ sequence ids make this safe - ids are known before insert, so no getGeneratedKeys
# conflict (an IDENTITY id would break the rewrite).
spring.datasource.url=${GLM_DB_URL}
spring.datasource.username=${GLM_DB_USERNAME}
spring.datasource.password=${GLM_DB_PASSWORD}

# 'update' is additive and data-preserving: against an empty MySQL it creates the tables; against an
# existing one it only adds missing tables/columns and never drops, renames or retypes anything. This
# gives "point at a fresh database and go" with no migration tooling. NOTE: it cannot apply renames, type
# changes or data backfills - when the schema needs those, switch to a migration tool (Flyway/Liquibase)
# and 'validate'.
spring.jpa.hibernate.ddl-auto=update

# Keep production logs clean.
spring.jpa.show-sql=false
